<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Page</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="css/registration.css">
</head>
<body>
    <section id="registration-page">
        <form action="php/registration.php" method="POST">
            <h2>Registration Page</h2>

            <div class="registration-body">
                <div class="userdata">
                    <input type="text" name="name" placeholder="Enter Your Name">
                    <!-- <label for="fullName">Full Name</label> -->
                    <i class="fa-solid fa-user"></i>
                </div>

                <div class="userdata">
                    <input type="email" name="email" placeholder="Enter Your Email">
                    <i class="fa-regular fa-envelope"></i>
                </div>

                <div class="userdata">
                    <input type="password" name="createPassword" placeholder="Create a Password">
                    <i class="fa-solid fa-lock"></i>
                </div>

                <div class="userdata">
                    <input type="password" name="conformPassword" placeholder="Conform a Password">
                    <i class="fa-solid fa-lock"></i>
                </div>

                <div class="gender-ratioButton">
                    <div class="ratioButton">
                        <input type="radio" name="gender" value="male">
                        <label>Male</label>
                    </div>

                    <div class="ratioButton">
                        <input type="radio" name="gender" value="female">
                        <label>Femail</label>
                    </div>

                    <div class="ratioButton">
                        <input type="radio" name="gender" value="other">
                        <label>Other</label>
                    </div>
                </div>

                <div class="term-checkbox">
                    <input type="checkbox" name="term_checkbox">
                    <span>I accept all terms & condition</span>
                </div>

                <div class="register-btn">
                    <button type="submit">Register</button>
                </div>

                <div class="login">
                    <span>Already have an account?</span>
                    <a href="login.html">
                        Login
                    </a>
                </div>
            </div>
            
        </form>
    </section>
</body>
</html>
